apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: vault-issuer
spec:
  vault:
    server: https://vault.ratelvig.local:8200
    path: pki/sign/cert-manager-role
    caBundle: ""
    auth:
      kubernetes:
        mountPath: /v1/auth/kubernetes
        role: cert-manager-vault-role
        secretRef:
          name: cert-manager-vault-sa-token
          key: token