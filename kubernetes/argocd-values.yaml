## Argo CD Helm Chart Values for Ratelvig Homelab
## Host: argocd.ratelvig-kube.local
## Chart: argo/argo-cd (https://argoproj.github.io/argo-helm)

global:
  domain: argocd.ratelvig-kube.local

configs:
  params:
    # Run Argo CD server in insecure mode behind Ingress (Traefik terminates TLS)
    server.insecure: true

server:
  ingress:
    enabled: true
    ingressClassName: traefik
    hostname: argocd.ratelvig-kube.local
    annotations:
      cert-manager.io/cluster-issuer: vault-issuer
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
    paths:
      - /
    pathType: Prefix
    tls:
      - secretName: argocd-server-tls
        hosts:
          - argocd.ratelvig-kube.local

  # Enable metrics if needed for monitoring
  metrics:
    enabled: false
