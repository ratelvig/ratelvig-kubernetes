---
- name: Create K3s configuration directory
  ansible.builtin.file:
    path: "{{ k3s_agent_config_dir }}"
    state: directory
    mode: '0755'
    owner: root
    group: root

- name: Deploy K3s agent configuration file
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ k3s_agent_config_dir }}/config.yaml"
    mode: '0640'
    owner: root
    group: root
  notify: Restart k3s-agent service

- name: Check if K3s binary is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_agent_binary_stat

- name: Download K3s installation script
  ansible.builtin.get_url:
    url: "{{ k3s_install_script_url }}"
    dest: /tmp/k3s-install.sh
    mode: '0755'
  when: not k3s_agent_binary_stat.stat.exists

- name: Run K3s agent installer
  ansible.builtin.command: /tmp/k3s-install.sh
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    K3S_URL: "{{ k3s_server_url }}"
    K3S_TOKEN: "{{ k3s_cluster_token }}"
  when: not k3s_agent_binary_stat.stat.exists
  changed_when: true

- name: Ensure K3s agent service is enabled and started
  ansible.builtin.systemd:
    name: "{{ k3s_agent_service_name }}"
    state: started
    enabled: yes
