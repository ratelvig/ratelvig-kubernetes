---
# K3s Cluster Configuration

# K3s Version
k3s_version: "v1.30.4+k3s1"

# Primary server connection URL used by agents (points to primary master IP / VIP / LB)
k3s_server_url: "https://{{ hostvars[groups['k3s_servers'][0]]['ansible_host'] }}:6443"

# K3s Cluster Token
# Set directly or load from encrypted vault (vault/secrets.yml)
# Default fallback uses vault_k3s_cluster_token if defined, otherwise predefined token
k3s_cluster_token: "{{ vault_k3s_cluster_token | default('K3sHomelabSuperSecretToken2026!') }}"

# Network configuration
k3s_flannel_backend: "vxlan" # options: vxlan, host-gw, wireguard-native, none
k3s_cluster_cidr: "10.42.0.0/16"
k3s_service_cidr: "10.43.0.0/16"
k3s_cluster_dns: "10.43.0.10"

# TLS Subject Alternative Names (SANs) for API Server
k3s_tls_sans:
  - "127.0.0.1"
  - "localhost"
  - "{{ hostvars[groups['k3s_servers'][0]]['ansible_host'] }}"
  - "k3s.homelab.local"
  - "kubernetes"
  - "kubernetes.default"
  - "kubernetes.default.svc"
  - "kubernetes.ratelvig.local"

# Components to disable (lightweight / homelab configuration)
k3s_disable_components: []

# Kubeconfig local destination path (fetched to local workspace)
k3s_kubeconfig_local_path: "{{ playbook_dir }}/../kubeconfig"

# Extra server & agent arguments
k3s_extra_server_args:
  - "--write-kubeconfig-mode=644"
  - "--kube-apiserver-arg=anonymous-auth=true"

k3s_extra_agent_args: []
